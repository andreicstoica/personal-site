name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: "3.12"
      - run: bunx --no-install playwright install --with-deps --only-shell chromium
      - run: bun run verify
      - run: bun run fonts --check
      - run: bun run test:smoke
